name: Build

on:
    push: ~
    pull_request: ~
    release:
        types: [created]
    workflow_dispatch: ~

jobs:
    tests:
        runs-on: ubuntu-latest

        name: PHP ${{ matrix.php }} - ${{ matrix.symfony }} - ${{ matrix.deps }}

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.2, 8.3, 8.4, 8.5 ]
                deps: [ locked ]
                symfony: [ '6.4.*', '7.4.*', '8.0.*' ]
                include:
                    - symfony: '6.4.*'
                      php: '8.1'
                      deps: lowest

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    ini-values: zend.exception_ignore_args=false
                    extensions: intl
                    tools: symfony, flex
                    coverage: none

            -
                name: Configure composer
                if: "${{ matrix.deps == 'highest' }}"
                run: composer config minimum-stability dev

            -
                name: Composer install
                uses: ramsey/composer-install@v3
                with:
                    dependency-versions: '${{ matrix.deps }}'
                    composer-options: --no-interaction --prefer-dist

            -
                name: Run analysis
                run: composer validate --strict

            -
                name: Run PHPUnit
                run: vendor/bin/phpunit --configuration phpunit.ci.xml --coverage-clover clover.xml
